    VideoAsset:
      description: |
        The VideoAsset adds a video to a Clip. The video can be sourced from a URL
        (`src`), generated from a text prompt (`prompt`), or both. At least one of
        `src` or `prompt` must be provided.

        - **Source URL:** set `src` to the URL of an mp4 (or compatible) video file.
        - **Generated:** set `prompt` to describe the motion. Choose a generator
          with `model` and configure it with model-specific `options`. Models that
          animate a starting image take it as `options.inputSrc`; the default model
          generates from the prompt alone. The generated `src` is filled in
          automatically.
        - **Both:** `src` acts as a preview placeholder while `prompt` drives
          generation — the video is regenerated from the prompt at render time.
          Unchanged prompts and options resolve from the generation cache.
      type: object
      properties:
        type:
          enum: ['video']
          default: video
          description: The type of asset - set to `video` for videos.
          type: string
        src:
          description: >-
            The video source URL. The URL must be publicly accessible or include
            credentials. When `prompt` is also set, `src` serves as a preview
            placeholder and the video is regenerated from the prompt at render time.
          type: string
          minLength: 1
          pattern: '\S'
          example: https://s3-ap-northeast-1.amazonaws.com/my-bucket/video.mp4
        prompt:
          description: >-
            A text prompt to generate the video from. The engine generates a video
            at render time and fills `src` automatically; an existing `src` is
            treated as a preview placeholder and replaced. Use `model` to choose
            the generator and `options` to configure it. A starting image goes in
            `options.inputSrc`, on the models that accept one.
          type: string
          maxLength: 4000
          example: Slowly zoom out and orbit left around the object.
        model:
          description: >-
            The generation model to use when `prompt` is set (e.g.
            `seedance-2.0-text-to-video`). Defaults to
            `seedance-2.0-text-to-video` if omitted. `GET /models` lists what is
            available and the options each accepts.
          type: string
          example: seedance-2.0-text-to-video
        options:
          description: >-
            Model-specific generation settings. Valid keys and values depend on
            the chosen `model` and are defined by the model registry. Omitted
            options use the model's defaults. Unknown or invalid options are
            rejected.
          type: object
          additionalProperties: true
          example:
            resolution: 720p
            duration: '8'
            generateAudio: true
        transcode:
          type: boolean
          description: >-
            Set to `true` to force re-encoding of the video during preprocessing.
            This can help resolve compatibility issues, fix rotation problems,
            synchronize audio, or convert formats. The video will be processed
            to ensure optimal compatibility with the rendering engine.
          example: false
        trim:
          description: >-
            The start trim point of the video clip, in seconds (defaults to 0). Videos
            will start from the in trim point. The video will play until the
            file ends or the Clip length is reached.
          type: number
          example: 2
        volume:
          description: >-
            Set the volume of the video clip. Use a number or an array of [Tween](./#tocs_tween) objects to create
            custom volume transitions.
          oneOf:
            - type: number
              description: >-
                The volume level for the video clip. Range varies from 0 to 1 where 0 is muted and 1 is full volume
                (defaults to 1).
              format: float
              minimum: 0
              maximum: 1
              example: 0.5
            - type: array
              description: >-
                An array of [Tween](./#tocs_tween) objects used to create a custom volume effect. Modify the volume
                of an asset over time.
              items:
                $ref: "./tween.yaml#/Tween"
        volumeEffect:
          description: >-
            Preset volume effects to apply to the video asset
            <ul>
              <li>`fadeIn` - fade volume in only</li>
              <li>`fadeOut` - fade volume out only</li>
              <li>`fadeInFadeOut` - fade volume in and out</li>
            </ul>
          enum:
            - none
            - fadeIn
            - fadeOut
            - fadeInFadeOut
          type: string
        speed:
          description: >-
            Adjust the playback speed of the video clip between 0 (paused) and 10 (10x normal speed) where 1 is normal
            speed (defaults to 1). Adjusting the speed will also adjust the duration of the clip and may require you to
            adjust the Clip length. For example, if you set speed to 0.5, the clip will need to be 2x as long to play
            the entire video (i.e. original length / 0.5). If you set speed to 2, the clip will need to be half as long
            to play the entire video (i.e. original length / 2).
          type: number
          format: float
          minimum: 0
          maximum: 10
          example: 1
        crop:
          $ref: "./crop.yaml#/Crop"
        chromaKey:
          $ref: "./chromakey.yaml#/ChromaKey"
      additionalProperties: false
      required:
        - type
