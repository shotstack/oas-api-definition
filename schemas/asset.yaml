Asset:
  type: object
  description: >-
    The type of asset to display for the duration of the Clip, i.e. a video clip or an image. Choose from one of
    the available asset types below.
  discriminator:
    propertyName: type
    mapping:
      video: '#/components/schemas/VideoAsset'
      image: '#/components/schemas/ImageAsset'
      text: '#/components/schemas/TextAsset'
      rich-text: '#/components/schemas/RichTextAsset'
      audio: '#/components/schemas/AudioAsset'
      luma: '#/components/schemas/LumaAsset'
      caption: '#/components/schemas/CaptionAsset'
      rich-caption: '#/components/schemas/RichCaptionAsset'
      html: '#/components/schemas/HtmlAsset'
      title: '#/components/schemas/TitleAsset'
      shape: '#/components/schemas/ShapeAsset'
      svg: '#/components/schemas/SvgAsset'
      text-to-image: '#/components/schemas/TextToImageAsset'
      image-to-video: '#/components/schemas/ImageToVideoAsset'
      text-to-speech: '#/components/schemas/TextToSpeechAsset'
  oneOf:
    - $ref: './videoasset.yaml#/VideoAsset'
    - $ref: './imageasset.yaml#/ImageAsset'
    - $ref: './textasset.yaml#/TextAsset'
    - $ref: './richtextasset.yaml#/RichTextAsset'
    - $ref: './audioasset.yaml#/AudioAsset'
    - $ref: './lumaasset.yaml#/LumaAsset'
    - $ref: './captionasset.yaml#/CaptionAsset'
    - $ref: './richcaptionasset.yaml#/RichCaptionAsset'
    - $ref: './htmlasset.yaml#/HtmlAsset'
    - $ref: './titleasset.yaml#/TitleAsset'
    - $ref: './shapeasset.yaml#/ShapeAsset'
    - $ref: './svgasset.yaml#/SvgAsset'
    - $ref: './texttoimageasset.yaml#/TextToImageAsset'
    - $ref: './imagetovideoasset.yaml#/ImageToVideoAsset'
    - $ref: './texttospeechasset.yaml#/TextToSpeechAsset'
  additionalProperties: false
