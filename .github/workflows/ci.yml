name: CI
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm test

      - name: Smoke tests
        run: pnpm test:smoke

      - name: Request examples
        run: pnpm test:examples

      - name: Install reference renderer
        working-directory: .shins
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Check reference versions and schema isolation
        run: |
          cp -R dist "$RUNNER_TEMP/schemas-before-docs"
          : > .tags
          pnpm build:docs
          node tests/reference-versions.cjs
          cmp dist/api.bundled.json build/docs/api.bundled.json
          pnpm build
          diff -r "$RUNNER_TEMP/schemas-before-docs" dist

      # Every code sample is run, so CI needs each sample language's runtime.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: false

      - name: Install sample libraries
        run: |
          pip install requests
          mkdir -p "$RUNNER_TEMP/php"
          composer require guzzlehttp/guzzle:^7 --working-dir "$RUNNER_TEMP/php" --no-interaction

      - name: Check reference code samples
        env:
          CODE_SAMPLES_PHP_DIR: ${{ runner.temp }}/php
        run: node tests/reference-code-samples.cjs

      - name: Dry run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run
