SvgAsset:
  description: |
    The SvgAsset is used to create scalable vector graphic (SVG) assets using
    raw SVG markup.

    ```json
    {
      "type": "svg",
      "src": "<svg width=\"100\" height=\"100\"><circle cx=\"50\" cy=\"50\" r=\"40\" fill=\"#FF0000\"/></svg>"
    }
    ```

    See [W3C SVG 2 Specification](https://www.w3.org/TR/SVG2/) for SVG markup syntax.
  type: object
  properties:
    type:
      description: The asset type - set to `svg` for SVG assets.
      type: string
      enum:
        - svg
      default: svg
      example: svg
    src:
      description: |
        Raw SVG markup string to import.

        **Supported elements:** `<path>`, `<rect>`, `<circle>`, `<ellipse>`,
        `<line>`, `<polygon>`, `<polyline>`
      type: string
      minLength: 1
      maxLength: 500000
      example: '<svg width="100" height="100"><circle cx="50" cy="50" r="40" fill="#3498db"/></svg>'
  additionalProperties: false
  required:
    - type
    - src
  example:
    type: svg
    src: '<svg width="100" height="100"><circle cx="50" cy="50" r="40" fill="#3498db"/></svg>'
