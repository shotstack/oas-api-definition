    AzureBlobStorageDestinationOptions:
      description: >-
        Pass additional options to control how files are stored in Azure Blob Storage.
      properties:
        accountName:
          description: >-
            The Azure Storage account name.
          type: string
          example: mystorageaccount
        container:
          description: >-
            The Blob container name. The container must exist in the Azure Storage account before files can be sent.
          type: string
          example: my-container
        prefix:
          description: >-
            A virtual directory prefix for the blob being sent, i.e. `videos` or `customerId/videos`.
          type: string
          nullable: true
          example: videos
        filename:
          description: >-
            Use your own filename instead of the default filenames generated by Shotstack. Note: omit the file extension
            as this will be appended depending on the output format. Also `-poster.jpg` and `-thumb.jpg` will be appended
            for poster and thumbnail images.
          type: string
          nullable: true
          example: my-file
      required:
        - accountName
        - container
