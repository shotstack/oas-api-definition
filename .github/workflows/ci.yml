name: CI
on:
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm test

      - name: Smoke tests
        run: pnpm test:smoke

      - name: Install reference renderer
        working-directory: .shins
        run: npm ci --omit=dev --no-audit --no-fund

      - name: Check reference versions and schema isolation
        run: |
          cp -R dist "$RUNNER_TEMP/schemas-before-docs"
          : > .tags
          pnpm build:docs
          node tests/reference-versions.cjs
          cmp dist/api.bundled.json build/docs/api.bundled.json
          pnpm build
          diff -r "$RUNNER_TEMP/schemas-before-docs" dist

      - name: Dry run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm exec semantic-release --dry-run
