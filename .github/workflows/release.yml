name: Release
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm test

      - name: Smoke tests
        run: pnpm test:smoke

      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          pnpm exec semantic-release
          # Capture the released version from package.json (semantic-release updates it)
          echo "version=$(node -p 'require("./package.json").version')" >> $GITHUB_OUTPUT

      - name: Dispatch SDK regeneration
        if: steps.release.outcome == 'success'
        env:
          DISPATCH_TOKEN: ${{ secrets.SDK_DISPATCH_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          REPOS=("shotstack-sdk-node" "shotstack-sdk-php" "shotstack-sdk-python" "shotstack-sdk-ruby" "shotstack-sdk-typescript")

          for repo in "${REPOS[@]}"; do
            success=false
            for attempt in 1 2 3; do
              status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
                "https://api.github.com/repos/shotstack/${repo}/dispatches" \
                -d "{\"event_type\":\"oas-release\",\"client_payload\":{\"version\":\"${VERSION}\"}}")

              if [ "$status" = "204" ]; then
                echo "✓ Dispatched to ${repo} (attempt ${attempt})"
                success=true
                break
              fi
              echo "✗ ${repo} returned ${status}, retrying in 5s (attempt ${attempt}/3)..."
              sleep 5
            done

            if [ "$success" = "false" ]; then
              echo "::error::Failed to dispatch to ${repo} after 3 attempts"
            fi
          done

  docs:
    name: Publish API reference
    needs: release
    # Skips rather than fails until the deploy role exists as a repository variable.
    if: vars.AWS_DOCS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # shins' devDependencies pull in node-sass, which no longer compiles on current Node.
      # The docs build only needs the runtime deps; the compiled CSS is committed.
      - name: Install shins
        working-directory: .shins
        run: npm ci --omit=dev --no-audit --no-fund

      # build-docs.sh splices .tags into <head> and removes the placeholder only when the file exists.
      - name: Provide empty head tags
        run: ': > .tags'

      - name: Build API reference
        run: pnpm build:docs

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DOCS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2

      - name: Sync to S3
        run: aws s3 sync build/docs/ s3://shotstack.io/docs/api --delete

      - name: Invalidate CloudFront
        if: vars.DOCS_CLOUDFRONT_DISTRIBUTION_ID != ''
        run: >
          aws cloudfront create-invalidation
          --distribution-id "${{ vars.DOCS_CLOUDFRONT_DISTRIBUTION_ID }}"
          --paths '/docs/api/*'
