BlurFilter:
  description: >-
    Blurs the clip. Set `value` to blur both axes equally, or set `x` and `y` to blur each axis separately.
  type: object
  additionalProperties: false
  properties:
    type:
      description: The filter type - set to `blur`.
      type: string
      enum:
        - blur
    value:
      description: >-
        Sets the blur radius in pixels, measured on the clip before it is scaled to fit the viewport. Use a
        number or an array of [Tween](./#tocs_tween) objects to change it over time.
      oneOf:
        - type: number
          description: >-
            The blur radius in pixels from 0 to 100. 0 applies no blur (default) and 10 matches the `blur`
            filter preset.
          minimum: 0
          maximum: 100
          example: 10
        - type: array
          description: >-
            An array of [Tween](./#tocs_tween) objects that change the blur radius over time.
          items:
            $ref: "./tween.yaml#/Tween"
    x:
      description: >-
        Sets the horizontal blur radius in pixels, overriding `value` on that axis. When omitted, `value` is
        used. Use a number or an array of [Tween](./#tocs_tween) objects to change it over time.
      oneOf:
        - type: number
          description: >-
            The horizontal blur radius in pixels from 0 to 100.
          minimum: 0
          maximum: 100
          example: 20
        - type: array
          description: >-
            An array of [Tween](./#tocs_tween) objects that change the horizontal blur radius over time.
          items:
            $ref: "./tween.yaml#/Tween"
    y:
      description: >-
        Sets the vertical blur radius in pixels, overriding `value` on that axis. When omitted, `value` is used.
        Use a number or an array of [Tween](./#tocs_tween) objects to change it over time.
      oneOf:
        - type: number
          description: >-
            The vertical blur radius in pixels from 0 to 100.
          minimum: 0
          maximum: 100
          example: 5
        - type: array
          description: >-
            An array of [Tween](./#tocs_tween) objects that change the vertical blur radius over time.
          items:
            $ref: "./tween.yaml#/Tween"
  required:
    - type
