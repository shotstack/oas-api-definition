SvgAsset:
  description: |
    The SvgAsset is used to add scalable vector graphics (SVG) to a video using raw SVG markup.

    **Supported elements:** &lt;path&gt;, &lt;rect&gt;, &lt;circle&gt;, &lt;ellipse&gt;,
    &lt;line&gt;, &lt;polygon&gt;, &lt;polyline&gt;

    **Automatically extracted from SVG markup:**
    - Path data (converted to a single combined path)
    - Fill color (from `fill` attribute or `style`)
    - Stroke color and width (from attributes or `style`)
    - Dimensions (from `width`/`height` or `viewBox`)
    - Opacity (from `opacity` attribute)

    See [W3C SVG 2 Specification](https://www.w3.org/TR/SVG2/) for path data syntax.
  type: object
  properties:
    type:
      description: The asset type - set to `svg` for SVG assets.
      type: string
      enum:
        - svg
      default: svg
      example: "&lt;svg fill='#000000' width='800px' height='800px' viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'&gt;&lt;path d='M48 256L192 112 224 144 112 256 224 368 192 400 48 256ZM288 368L400 256 288 144 320 112 464 256 320 400 288 368Z' /&gt;&lt;/svg&gt;"
    src:
      description: |
        Raw SVG markup string. The SVG must contain valid SVG elements. The shape,
        fill, stroke, dimensions and opacity are automatically extracted from the
        SVG content.
      type: string
      minLength: 1
      maxLength: 500000
      example: '      example: "&lt;svg fill="#000000" width="800px" height="800px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"&gt;&lt;path d="M48 256L192 112 224 144 112 256 224 368 192 400 48 256ZM288 368L400 256 288 144 320 112 464 256 320 400 288 368Z" /&gt;&lt;/svg&gt;"lt;svg fill="#000000" width="800px" height="800px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"      example: "&lt;svg fill="#000000" width="800px" height="800px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"&gt;&lt;path d="M48 256L192 112 224 144 112 256 224 368 192 400 48 256ZM288 368L400 256 288 144 320 112 464 256 320 400 288 368Z" /&gt;&lt;/svg&gt;"gt;      example: "&lt;svg fill="#000000" width="800px" height="800px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"&gt;&lt;path d="M48 256L192 112 224 144 112 256 224 368 192 400 48 256ZM288 368L400 256 288 144 320 112 464 256 320 400 288 368Z" /&gt;&lt;/svg&gt;"lt;path d="M48 256L192 112 224 144 112 256 224 368 192 400 48 256ZM288 368L400 256 288 144 320 112 464 256 320 400 288 368Z" /      example: "&lt;svg fill="#000000" width="800px" height="800px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"&gt;&lt;path d="M48 256L192 112 224 144 112 256 224 368 192 400 48 256ZM288 368L400 256 288 144 320 112 464 256 320 400 288 368Z" /&gt;&lt;/svg&gt;"gt;      example: "&lt;svg fill="#000000" width="800px" height="800px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"&gt;&lt;path d="M48 256L192 112 224 144 112 256 224 368 192 400 48 256ZM288 368L400 256 288 144 320 112 464 256 320 400 288 368Z" /&gt;&lt;/svg&gt;"lt;/svg      example: "&lt;svg fill="#000000" width="800px" height="800px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg"&gt;&lt;path d="M48 256L192 112 224 144 112 256 224 368 192 400 48 256ZM288 368L400 256 288 144 320 112 464 256 320 400 288 368Z" /&gt;&lt;/svg&gt;"gt;'
  additionalProperties: false
  required:
    - type
    - src
  example:
    type: svg
    src: "&lt;svg fill='#000000' width='800px' height='800px' viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'&gt;&lt;path d='M48 256L192 112 224 144 112 256 224 368 192 400 48 256ZM288 368L400 256 288 144 320 112 464 256 320 400 288 368Z' /&gt;&lt;/svg&gt;"
