    TemplateDataResponseData:
      description: The response data returned with the [TemplateDataResponse](#tocs_templatedataresponse).
      properties:
        id:
          description:  The unique id of the template in UUID format.
          type: string
          example: f5493c17-d01f-445c-bb49-535fae65f219
        name:
          description: The template name.
          type: string
          example: My template
        owner:
          description: The owner id of the templates.
          type: string
          example: 5ca6hu7s9k
        template:
          description: The [Edit](#tocs_edit) template.
          $ref: "../edit.yaml#/Edit"
          example:
            timeline:
              background: '#000000'
              fonts:
                - src: 'https://fonts.gstatic.com/s/montserrat/v31/JTUSjIg1_i6t8kCHKm45xW5rygbi49c.ttf'
              tracks:
                - clips:
                    - asset:
                        type: rich-text
                        text: Hello World
                        font:
                          family: JTUSjIg1_i6t8kCHKm45xW5rygbi49c
                          size: 64
                          weight: '700'
                          color: '#ffffff'
                        align:
                          horizontal: center
                          vertical: middle
                      start: 0
                      length: 4
                      transition:
                        in: fade
                        out: fade
                    - asset:
                        type: image
                        src: 'https://shotstack-assets.s3.amazonaws.com/images/earth.jpg'
                      start: 4
                      length: 3
                      effect: zoomIn
                      filter: greyscale
                - clips:
                    - asset:
                        type: video
                        src: 'https://shotstack-assets.s3.amazonaws.com/footage/beach.mp4'
                        transcode: true
                      start: 7
                      length: 4.5
                    - asset:
                        type: video
                        src: 'https://shotstack-assets.s3.amazonaws.com/footage/city-timelapse.mp4'
                        volume: 0.5
                      start: 11.5
                      length: 5
                      transition:
                        out: wipeLeft
                - clips:
                    - asset:
                        type: audio
                        src: 'https://shotstack-assets.s3.amazonaws.com/music/unminus/lit.mp3'
                        effect: fadeInFadeOut
                      start: 0
                      length: end
            output:
              format: mp4
              resolution: sd
      required:
        - id
        - name
        - owner
        - template
      type: object
