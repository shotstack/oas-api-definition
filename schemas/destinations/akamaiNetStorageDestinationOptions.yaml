    AkamaiNetStorageDestinationOptions:
      description: >-
        Pass additional options to control how files are stored in Akamai NetStorage.
      properties:
        host:
          description: >-
            The Akamai NetStorage hostname, i.e. `example-nsu.akamaihd.net`.
          type: string
          example: example-nsu.akamaihd.net
        cpCode:
          description: >-
            The Content Provider code (CP code) for the NetStorage upload directory.
          type: string
          example: "123456"
        path:
          description: >-
            A remote directory path/prefix for the file being sent, i.e. `videos` or `customerId/videos`.
          type:
            - string
            - "null"
          example: videos
        filename:
          description: >-
            Use your own filename instead of the default filenames generated by Shotstack. Note: omit the file extension
            as this will be appended depending on the output format. Also `-poster.jpg` and `-thumb.jpg` will be appended
            for poster and thumbnail images.
          type:
            - string
            - "null"
          example: my-file
      required:
        - host
        - cpCode
