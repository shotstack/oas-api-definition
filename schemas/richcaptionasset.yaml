RichCaptionAsset:
  description: |
    The RichCaptionAsset provides word-level caption animations with rich-text styling. It supports
    karaoke-style highlighting, word-by-word animations, and advanced typography. Captions can be
    sourced from SRT/VTT/TTML subtitle files, from audio/video media URLs (auto-transcribed), or
    from alias references to other clips in the same timeline.
  type: object
  properties:
    type:
      enum: ['rich-caption']
      default: rich-caption
      description: The type of asset - set to `rich-caption` for rich captions.
      type: string
    src:
      description: >-
        Source for the caption words. Accepts three formats:
        (1) the URL to a subtitle file (`.srt`, `.vtt`, `.ttml`, or `.dfxp`) which is parsed
        directly;
        (2) the URL to an audio or video media file (`.mp4`, `.mov`, `.webm`, `.mp3`, `.wav`,
        `.m4a`, `.flac`, `.aac`, `.ogg`, and related formats) which is auto-transcribed;
        (3) an alias reference in the form `alias://clip-name` where `clip-name` is the alias of
        another audio, video, or text-to-speech clip in the same timeline — the referenced clip's
        source is auto-transcribed.
        For file URLs, the URL must be publicly accessible or include credentials. Content is
        classified at runtime and unsupported content types (HTML, PDF, images, archives) are
        rejected with a structured error.
      type: string
      minLength: 1
      example: "alias://audio"
    font:
      description: Font styling properties for inactive words.
      $ref: "./richcaptionproperties.yaml#/RichCaptionFont"
    style:
      description: Text style properties including spacing, line height, and transformations.
      $ref: "./richcaptionproperties.yaml#/RichCaptionStyle"
    stroke:
      description: Text stroke (outline) properties for inactive words.
      $ref: "./richtextproperties.yaml#/RichTextStroke"
    shadow:
      description: Text shadow properties.
      $ref: "./richtextproperties.yaml#/RichTextShadow"
    background:
      description: Background styling properties for the caption bounding box.
      $ref: "./richtextproperties.yaml#/RichTextBackground"
    border:
      description: Border styling properties for the caption bounding box.
      $ref: "./richtextproperties.yaml#/RichTextBorder"
    padding:
      description: >-
        Padding inside the caption bounding box. Can be a single number (applied to all sides)
        or an object with individual sides.
      oneOf:
        - type: number
          minimum: 0
          description: Padding in pixels applied to all sides.
          example: 10
        - $ref: "./richtextproperties.yaml#/RichTextPadding"
    align:
      description: Text alignment properties (horizontal and vertical).
      $ref: "./richtextproperties.yaml#/RichTextAlignment"
    active:
      description: Styling properties for the active/highlighted word. These override the base styling when a word is being spoken.
      $ref: "./richcaptionproperties.yaml#/RichCaptionActive"
    animation:
      description: Word-level animation properties controlling how words are highlighted or revealed.
      $ref: "./richcaptionproperties.yaml#/RichCaptionAnimation"
  additionalProperties: false
  required:
    - type
    - src
