GenerationAsset:
  description: >-
    An image, video or audio asset to generate. Image and video assets require a
    prompt. Audio uses a prompt for spoken text or a sound description. Legacy
    text-to-image, image-to-video and text-to-speech assets are also accepted.
  oneOf:
    - allOf:
        - oneOf:
            - $ref: "./imageasset.yaml#/ImageAsset"
            - $ref: "./videoasset.yaml#/VideoAsset"
            - $ref: "./audioasset.yaml#/AudioAsset"
            - $ref: "./texttoimageasset.yaml#/TextToImageAsset"
            - $ref: "./imagetovideoasset.yaml#/ImageToVideoAsset"
        - type: object
          properties:
            prompt:
              type: string
              minLength: 1
              pattern: '\S'
          required:
            - prompt
          additionalProperties: true
    - $ref: "./texttospeechasset.yaml#/TextToSpeechAsset"
