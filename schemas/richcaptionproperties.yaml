RichCaptionActiveFont:
  description: Font properties for the active/highlighted word.
  type: object
  properties:
    color:
      description: The active word color using hexadecimal color notation.
      type: string
      pattern: "^#[A-Fa-f0-9]{6}$"
      example: "#C96741"
    background:
      description: The background color behind the active word using hexadecimal color notation.
      type: string
      pattern: "^#[A-Fa-f0-9]{6}$"
      example: "#000000"
    opacity:
      description: The opacity of the active word where 1 is opaque and 0 is transparent.
      type: number
      minimum: 0
      maximum: 1
      default: 1
      example: 1
    size:
      description: The font size of the active word in pixels. Overrides the scale property when set.
      type: number
      minimum: 1
      maximum: 500
      example: 120
    textDecoration:
      description: Text decoration to apply to the active word.
      type: string
      enum:
        - none
        - underline
        - line-through
      default: "none"
      example: "underline"
  additionalProperties: false

RichCaptionActive:
  description: Styling properties for the active/highlighted word.
  type: object
  properties:
    font:
      description: Font properties for the active word.
      $ref: "#/RichCaptionActiveFont"
    stroke:
      description: Stroke properties for the active word. Set to "none" to explicitly remove the base stroke on the active word.
      oneOf:
        - $ref: "./richtextproperties.yaml#/RichTextStroke"
        - type: string
          enum:
            - none
    shadow:
      description: Shadow properties for the active word. Set to "none" to explicitly remove the base shadow on the active word.
      oneOf:
        - $ref: "./richtextproperties.yaml#/RichTextShadow"
        - type: string
          enum:
            - none
    scale:
      description: Scale multiplier for the active word. 1.0 is normal size, 1.2 is 20% larger.
      type: number
      minimum: 0.5
      maximum: 2.0
      default: 1.0
      example: 1.2
  additionalProperties: false

RichCaptionAnimation:
  description: Word-level animation properties for caption effects.
  type: object
  properties:
    style:
      description: >-
        The animation style to apply to words:
        <ul>
          <li>`karaoke` - Word-by-word color fill as spoken (shows all words, highlights active)</li>
          <li>`highlight` - Word changes to active color when spoken (shows all words)</li>
          <li>`pop` - Each word scales up when active</li>
          <li>`fade` - Gradual opacity transition per word</li>
          <li>`slide` - Words slide in from a direction</li>
          <li>`bounce` - Spring animation on word appearance</li>
          <li>`typewriter` - Words appear one by one and stay visible</li>
          <li>`none` - No animation, all words visible immediately</li>
        </ul>
      type: string
      enum:
        - karaoke
        - highlight
        - pop
        - fade
        - slide
        - bounce
        - typewriter
        - none
      default: "highlight"
      example: "highlight"
    direction:
      description: Direction for directional animations (slide). Only applicable when style is `slide`.
      type: string
      enum:
        - left
        - right
        - up
        - down
      default: "up"
      example: "up"
  additionalProperties: false
  required:
    - style

RichCaptionFont:
  description: Font properties for rich captions. Defaults to Roboto.
  properties:
    family:
      description: >-
        The font family name. This must be the Family name embedded in the font, i.e. "Roboto".
      type: string
      example: "Roboto"
      default: "Roboto"
    size:
      description: The size of the font in pixels (px). Must be between 1 and 500.
      type: integer
      minimum: 1
      maximum: 500
      default: 24
      example: 48
    weight:
      description: >-
        The weight of the font. Can be a number (100-900) or a string ('normal', 'bold', etc.).
        100 is lightest, 900 is heaviest (boldest).
      default: "400"
    color:
      description: The text color using hexadecimal color notation.
      type: string
      pattern: "^#[A-Fa-f0-9]{6}$"
      default: "#ffffff"
      example: "#ffffff"
    opacity:
      description: The opacity of the text where 1 is opaque and 0 is transparent.
      type: number
      minimum: 0
      maximum: 1
      default: 1
      example: 0.9
    background:
      description: The background color behind the text using hexadecimal color notation.
      type: string
      pattern: "^#[A-Fa-f0-9]{6}$"
      example: "#000000"
  additionalProperties: false
  type: object

RichCaptionStyle:
  description: Text style properties for rich captions. Same as RichTextStyle but without wordSpacing.
  properties:
    letterSpacing:
      description: Additional spacing between letters in pixels. Can be negative for tighter spacing.
      type: number
      default: 0
      example: 2
    lineHeight:
      description: The line height as a multiplier of the font size. Must be between 0 and 10.
      type: number
      minimum: 0
      maximum: 10
      default: 1.2
      example: 1.5
    textTransform:
      description: Text transformation to apply.
      type: string
      enum:
        - none
        - uppercase
        - lowercase
        - capitalize
      default: "none"
      example: "uppercase"
    size:
      description: The font size of the active word in pixels. Overrides the scale property when set.
      type: number
      minimum: 1
      maximum: 500
      example: 120
    textDecoration:
      description: Text decoration to apply.
      type: string
      enum:
        - none
        - underline
        - line-through
      default: "none"
      example: "underline"
    gradient:
      description: Gradient fill for text instead of solid color.
      $ref: "./richtextproperties.yaml#/RichTextGradient"
  additionalProperties: false
  type: object
