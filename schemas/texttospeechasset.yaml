TextToSpeechAsset:
  description: >-
    The TextToSpeechAsset lets you generate a voice over from text using a text-to-speech service.
    The generated audio can be trimmed, faded and have its volume and speed adjusted using the
    same properties available on the AudioAsset.
  type: object
  properties:
    type:
      type: string
      description: The type of asset - set to `text-to-speech` for text-to-speech.
      enum: ['text-to-speech']
      default: text-to-speech
    text:
      type: string
      description: The text to convert to speech.
      example: "This is a text to speech example generated by Shotstack"
    voice:
      type: string
      description: >-
        The voice to use for the text-to-speech conversion.
      example: Matthew
    language:
      type: string
      description: >-
        The language code for the text-to-speech conversion.
      example: en-US
    newscaster:
      type: boolean
      description: >-
        Set the voice to newscaster mode.
      default: false
    trim:
      description: >-
        The start trim point of the audio clip, in seconds (defaults to 0). Audio
        will start from the trim point. The audio will play until the file ends or
        the Clip length is reached.
      type: number
    volume:
      description: >-
        Set the volume of the audio clip. Use a number or an array of [Tween](./#tocs_tween) objects to create
        custom volume transitions.
      oneOf:
        - type: number
          description: >-
            The volume level for the audio clip. Range varies from 0 to 1 where 0 is muted and 1 is full volume
            (defaults to 1).
          format: float
          minimum: 0
          maximum: 1
          example: 0.5
        - type: array
          description: >-
            An array of [Tween](./#tocs_tween) objects used to create a custom volume effect. Modify the volume
            of an asset over time.
          items:
            $ref: "./tween.yaml#/Tween"
    speed:
      description: >-
        Adjust the playback speed of the audio clip between 0 (paused) and 10 (10x normal speed), where 1 is normal
        speed (defaults to 1). Adjusting the speed will also adjust the duration of the clip and may require you to
        adjust the Clip length.
      type: number
      format: float
      minimum: 0
      maximum: 10
      example: 1
    effect:
      description: >-
        The effect to apply to the audio asset
        <ul>
          <li>`fadeIn` - fade volume in only</li>
          <li>`fadeOut` - fade volume out only</li>
          <li>`fadeInFadeOut` - fade volume in and out</li>
        </ul>
      enum:
        - none
        - fadeIn
        - fadeOut
        - fadeInFadeOut
      type: string
  required: ['type', 'text', 'voice']
