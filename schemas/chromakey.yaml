    ChromaKey:
      description: >-
        Chroma key is a technique that replaces a specific color in a video with a different background
        image or video, enabling seamless integration of diverse environments. Commonly used for green
        screen and blue screen effects.
      properties:
        color:
          description: >-
            The chroma key color as a hex value. Use green (#00b140) for green screens or blue (#0000FF)
            for blue screens. Any valid hex color can be used as the key color.
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
          example: "#00b140"
        threshold:
          description: >-
            Pixels within this distance from the key color are eliminated by setting their alpha values to zero.
          type: integer
          minimum: 0
          maximum: 250
          example: 150
        halo:
          description: >-
            Pixels within the halo distance from the threshold boundary are given an increasing alpha value based on
            their distance from the threshold.
          type: integer
          minimum: 0
          maximum: 250
          example: 100
      additionalProperties: false
      required:
        - color
      type: object
